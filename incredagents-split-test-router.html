<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IncredAgents — AI Agents Built in 48 Hours</title>
<style>
  body { margin: 0; background: #0a0a12; color: #eaeaef; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  p { color: #8888a8; font-size: 14px; }
</style>
</head>
<body>
  <p>Loading your offer&hellip;</p>
<script>
(function(){
  var VARIANTS = ['a','b','c','d'];
  var COOKIE_NAME = 'ia_variant';
  var COOKIE_DAYS = 30;

  function getCookie(name) {
    var m = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
    return m ? m.pop() : null;
  }

  function setCookie(name, value, days) {
    var d = new Date();
    d.setTime(d.getTime() + (days*24*60*60*1000));
    document.cookie = name + '=' + value + ';path=/;expires=' + d.toUTCString();
  }

  function getVariant() {
    var existing = getCookie(COOKIE_NAME);
    if (existing && VARIANTS.indexOf(existing) !== -1) return existing;
    var idx = Math.floor(Math.random() * VARIANTS.length);
    var v = VARIANTS[idx];
    setCookie(COOKIE_NAME, v, COOKIE_DAYS);
    track('impression', v);
    return v;
  }

  function track(event, variant) {
    var t = {};
    try { t = JSON.parse(localStorage.getItem('ia_stats')||'{}'); } catch(e){}
    if (!t[variant]) t[variant] = { impressions: 0, clicks: 0 };
    if (event === 'impression') t[variant].impressions++;
    if (event === 'click') t[variant].clicks++;
    try { localStorage.setItem('ia_stats', JSON.stringify(t)); } catch(e){}
    var u = '/tmp/ia-track?e=' + event + '&v=' + variant + '&r=' + Math.random();
    if (navigator.sendBeacon) navigator.sendBeacon(u);
  }

  var variant = getVariant();
  var pages = {
    'a': '/offer-a',
    'b': '/offer-b',
    'c': '/offer-c',
    'd': '/offer-d'
  };

  window.__ia_variant = variant;
  window.__ia_track = track;

  window.location.replace(pages[variant]);
})();
</script>
</body>
</html>
