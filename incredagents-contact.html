<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IncredAgents — Contact & Lead Form</title>
<style>
:root {
  --bg: #0a0a12; --surface: #131320; --border: #252540; --text: #eaeaef;
  --muted: #8888a8; --accent: #7c5cfc; --accent2: #5b3fd4; --green: #34d399;
  --radius: 14px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; line-height: 1.5; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 40px; max-width: 500px; width: 100%; }
h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 6px; }
.sub { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
.form-group { margin-bottom: 18px; }
label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
input, textarea, select { width: 100%; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; font-family: inherit; transition: border-color 0.2s; }
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
textarea { resize: vertical; min-height: 80px; }
select { appearance: none; cursor: pointer; }
button { width: 100%; padding: 14px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
button:hover { background: var(--accent2); }
.success-msg { display: none; text-align: center; padding: 20px; }
.success-msg .check { font-size: 48px; margin-bottom: 12px; }
.success-msg h2 { font-size: 20px; margin-bottom: 6px; }
.success-msg p { color: var(--muted); font-size: 14px; }
.saved-leads { margin-top: 16px; font-size: 13px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<div class="card" id="form-card">
  <h1>Get Your AI Agent</h1>
  <p class="sub">Tell us what you need. We'll build it in 48 hours. $497.</p>
  <form id="lead-form">
    <div class="form-group">
      <label>Your Name</label>
      <input type="text" name="name" required placeholder="Jane Smith">
    </div>
    <div class="form-group">
      <label>Business Email</label>
      <input type="email" name="email" required placeholder="jane@yourbusiness.com">
    </div>
    <div class="form-group">
      <label>Industry</label>
      <select name="industry">
        <option value="">Select your industry</option>
        <option>MedSpa / Aesthetics</option>
        <option>Dental</option>
        <option>Legal</option>
        <option>Real Estate</option>
        <option>E-commerce</option>
        <option>SaaS</option>
        <option>Restaurant / Hospitality</option>
        <option>Other Professional Services</option>
      </select>
    </div>
    <div class="form-group">
      <label>What do you need the AI to do?</label>
      <textarea name="need" placeholder="e.g., Answer calls after hours and book Botox consultations automatically..."></textarea>
    </div>
    <div class="form-group">
      <label>Which offer interests you most?</label>
      <select name="offer">
        <option value="a">$497 One-Time — 48 Hour Build</option>
        <option value="b">Free 7-Day Trial — Zero Risk</option>
        <option value="c">Premium Bundle — Chat + Voice AI ($1,497)</option>
        <option value="d">Pay-Per-Appointment — $0 Setup</option>
      </select>
    </div>
    <button type="submit">Send — We'll Reply Within 2 Hours →</button>
  </form>
  <p class="saved-leads" id="lead-count"></p>
</div>

<div class="success-msg" id="success-msg">
  <div class="check">✓</div>
  <h2>Got it. We're on it.</h2>
  <p>We'll review your needs and reply within 2 hours with a customized demo showing exactly what your AI agent would look like. No obligation.</p>
</div>

<script>
(function(){
  var STORAGE_KEY = 'ia_leads';
  var form = document.getElementById('lead-form');
  var formCard = document.getElementById('form-card');
  var success = document.getElementById('success-msg');
  var countEl = document.getElementById('lead-count');

  function getLeads() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch(e) { return []; }
  }

  function updateCount() {
    var c = getLeads().length;
    if (c > 0) countEl.textContent = c + ' lead' + (c!==1?'s':'') + ' captured (localStorage)';
  }
  updateCount();

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    var fd = new FormData(form);
    var lead = {
      name: fd.get('name'),
      email: fd.get('email'),
      industry: fd.get('industry'),
      need: fd.get('need'),
      offer: fd.get('offer'),
      timestamp: new Date().toISOString(),
      source: window.__ia_variant || 'direct'
    };
    var leads = getLeads();
    leads.push(lead);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(leads)); } catch(e) {}
    updateCount();

    try {
      var t = JSON.parse(localStorage.getItem('ia_stats')||'{}');
      var v = window.__ia_variant || 'direct';
      if (!t[v]) t[v] = { impressions: 0, clicks: 0, leads: 0 };
      t[v].leads = (t[v].leads||0) + 1;
      localStorage.setItem('ia_stats', JSON.stringify(t));
    } catch(e) {}

    formCard.style.display = 'none';
    success.style.display = 'block';
  });
})();
</script>
</body>
</html>
